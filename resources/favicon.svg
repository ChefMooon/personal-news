<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Personal News — Spectral Horizon</title>
  <desc id="desc">A crisp blue globe with broad panels and open charcoal channels on a dark charcoal gradient tile.</desc>
  <defs>
    <linearGradient id="tile" x1="108" y1="84" x2="916" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252C31"/>
      <stop offset="1" stop-color="#13191F"/>
    </linearGradient>
    <clipPath id="sphere-clip"><circle cx="512" cy="512" r="344"/></clipPath>
  </defs>
  <rect id="app-tile" x="32" y="32" width="960" height="960" rx="220" fill="url(#tile)"/>
  <g id="globe" clip-path="url(#sphere-clip)">
    <circle id="sphere" cx="512" cy="512" r="344" fill="#4B8EFF"/>
    <ellipse id="central-meridian" cx="512" cy="512" rx="156" ry="344" fill="#9CCBFF" stroke="#1C2329" stroke-width="28"/>
    <g id="latitude-channels" fill="none" stroke="#1C2329" stroke-width="28">
      <path d="M190 386C350 466 674 466 834 386"/>
      <path d="M190 638C350 558 674 558 834 638"/>
    </g>
  </g>
</svg>
